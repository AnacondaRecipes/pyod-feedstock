{% set name = "pyod" %}
{% set version = "1.1.3" %}

package:
  skip: True # [py<36] From upstream "Required Dependencies Python 3.6 or higher"
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ae39808c8da04ce47eee3757ef641feb67e610bddb134b3362fd6f5cb2c6c7cd

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - joblib
    - matplotlib-base
    - numpy >=1.19
    - numba >=0.51
    - scipy >=1.5.1
    - scikit-learn >=0.22.0
    - six
# Optional dependencies don't contain version information, therefore not added as run_constrained
# https://github.com/yzhao062/pyod/blob/v1.1.3/README.rst

test:
  imports:
    - pyod
    - pyod.models
    - pyod.utils
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://github.com/yzhao062/pyod
  dev_url: https://github.com/yzhao062/pyod
  doc_url: https://pyod.readthedocs.io
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)
  description: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)

extra:
  recipe-maintainers:
    - yzhao062
    - apcamargo
