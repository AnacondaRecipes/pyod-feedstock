{% set name = "pyod" %}
{% set version = "3.6.4" %}
{% set deselect_tests = " --deselect=test_lscp.py::TestLSCP::test_prediction_scores" %}
{% set deselect_tests = 'deselect_tests + " --deselect=test_mad.py::TestMAD"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=test_mcd.py::TestMCD::test_predict_rank"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=test_thresholds.py::TestThresholds"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=test_torch_utility.py::TestBaseDL::test_linear_block"' %}

# E   ModuleNotFoundError: No module named 'pythresh'
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/yzhao062/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f441e7b3c8b31afba8d119908d2752059342db0cbb231f3dbe165e4949e8b78e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=77.0.0
  run:
    - python
    - joblib
    - matplotlib-base
    - numpy >=1.19
    - numba >=0.51
    - scipy >=1.5.1
    - scikit-learn >=0.22.0
  run_constrained:
    - librosa >=0.10
    - sentence-transformers >=5.0.0
    - pytorch >=2.0
    - pytorch_geometric >=2.0
    - transformers >=4.25.1
    - mcp >=1.0
    - openai >=1.0
    - pythresh >=1.0.0

test:
  imports:
    - pyod
    - pyod.models
    - pyod.utils
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # suod dependency is not in the main channel
    - rm ${SP_DIR}/pyod/test/test_suod.py  # [unix]
    - del /f /q %SP_DIR%\pyod\test\test_suod.py  # [win]
    # combo dependency is not in the main channel
    - rm ${SP_DIR}/pyod/test/test_combination.py  # [unix]
    - del /f /q %SP_DIR%\pyod\test\test_combination.py  # [win]
    - rm ${SP_DIR}/pyod/test/test_feature_bagging.py  # [unix]
    - del /f /q %SP_DIR%\pyod\test\test_feature_bagging.py  # [win]
    # pytorch for python 3.14 is not in the main channel
    - pytest --pyargs pyod.test {{ deselect_tests }}  # [py<314]
  requires:
    - pip
    - pytest
    - xgboost
    - pandas
    - pytorch-cpu  # [py<314]
    - statsmodels
    - tqdm

about:
  home: https://github.com/yzhao062/pyod
  dev_url: https://github.com/yzhao062/pyod
  doc_url: https://pyod.readthedocs.io
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)
  description: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)

extra:
  recipe-maintainers:
    - yzhao062
    - apcamargo
