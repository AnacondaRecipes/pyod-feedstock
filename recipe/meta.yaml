{% set name = "pyod" %}
{% set version = "2.0.6" %}
{% set ignore_tests = "" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_combination.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_feature_bagging.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_mo_gaal.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_mo_gaal.py" %}  # [py>311 or win]
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_so_gaal.py" %}  # [py>311 or win]
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_vae.py" %}  # [py>311 or win]
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_alad.py" %}  # [py>311 or win]
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_deepsvdd.py" %}  # [py>311 or win]
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_suod.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_thresholds.py" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/yzhao062/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c2ce8cdcba28e6de1b505c9fa716665df79a1c8ac4ff26e124b76d4981315e73
  patches:
    - 0001-replace-legacy-keras-with-keras-3.patch

build:
  # From upstream "Required Dependencies Python 3.6 or higher"
  skip: true  # [py<36]
  # Dependency numpy<2.0 not available for Python 3.13
  skip: true  # [py>=313]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - patch  #[not win]
    - m2-patch  #[win]
  host:
    - pip
    - python
    - setuptools >=38.6.0
  run:
    - python
    - joblib
    - matplotlib-base
    - numpy >=1.19
    - numba >=0.51
    - scipy >=1.5.1
    - scikit-learn >=0.22.0
    - six
  run_constrained:
    # contraining tensorflow to >=2.12,<2.16 to enable legacy keras, which is needed for following models
    # alad, anogan, auto_encoder, deep_svdd, gaal_base, mo_gaal, so_gaal, vae
    # older tensorflows are not available for Python >=3.12, so a newer version will be selected and
    # the aforementionned models will not work
    - tensorflow >=2.12,<2.16  # [py<=311 and (not win)]
    - tensorflow >=2.16  # [py>311 or win]
  # Missing combo dependency
  # tensorflow.keras.optimizers missing from keras >=2.12, pinned by tensorflow >=2.12
  # Requires Keras <3.0
  # Missing suod dependency
  # Missing pythresh dependency

test:
  source_files:
    - pyod/test
  imports:
    - pyod
    - pyod.models
    - pyod.utils
  requires:
    - pytest
    - xgboost
    - pandas
    - tensorflow
    - keras
    - pytorch
    - statsmodels
  commands:
    # skipping pip check because of errors with tensorflow, which is an optional dependency
    # - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # skip tests on osx because of segfaults
    - pytest -vv {{ ignore_tests }} pyod/test  # [not osx]

about:
  home: https://github.com/yzhao062/pyod
  dev_url: https://github.com/yzhao062/pyod
  doc_url: https://pyod.readthedocs.io
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)
  description: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)

extra:
  recipe-maintainers:
    - yzhao062
    - apcamargo
