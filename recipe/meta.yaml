{% set name = "pyod" %}
{% set version = "3.6.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/yzhao062/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f441e7b3c8b31afba8d119908d2752059342db0cbb231f3dbe165e4949e8b78e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true # [py<39]
  
requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.0
  run:
    - python
    - joblib >=1.5
    - matplotlib-base
    - numpy >=1.19
    - numba >=0.51
    - scipy >=1.5.1
    - scikit-learn >=0.22.0

# No combo and suod packages
{% set ignore_tests = " --ignore=pyod/test/test_suod.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_combination.py" %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_feature_bagging.py " %}
{% set ignore_tests = ignore_tests + " --ignore=pyod/test/test_thresholds.py" %}

# E   ModuleNotFoundError: No module named 'pythresh'
{% set deselect_tests = " --deselect=pyod/test/test_lscp.py::TestLSCP::test_prediction_scores" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_mad.py::TestMAD" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_mcd.py::TestMCD::test_predict_rank" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_thresholds.py::TestThresholds" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_torch_utility.py::TestBaseDL::test_linear_block" %}
# ModuleNotFoundError: No module named 'pyod.test'
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_skill_api_refs.py::test_validator_catches_regression_shapes" %}

# AssertionError:
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_lunar.py::TestLUNARKwargsAndRandomState::test_random_state_is_accepted_and_deterministic" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_cli.py::test_legacy_and_unified_install_match_subprocess" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_ad_engine.py::TestRandomStateDeterminism::test_engine_seed_flows_to_lunar_plan" %}
{% set deselect_tests = deselect_tests + " --deselect=pyod/test/test_deepsvdd.py::TestDeepSVDD::test_prediction_scores" %}


test:
  source_files:
    - pyod/test
    - pyod/skills
    - pyod/utils
    - scripts
  imports:
    - pyod
    - pyod.models
    - pyod.utils
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest ./pyod/test {{ deselect_tests }} {{ ignore_tests }} # [py<314]
  requires:
    - pip
    - pytest
    - xgboost
    - pandas
    - pytorch-cpu  # [py<314]
    - statsmodels
    - tqdm

about:
  home: https://github.com/yzhao062/pyod
  dev_url: https://github.com/yzhao062/pyod
  doc_url: https://pyod.readthedocs.io
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)
  description: A Python Toolkit for Scalable Outlier Detection (Anomaly Detection)

extra:
  recipe-maintainers:
    - yzhao062
    - apcamargo
